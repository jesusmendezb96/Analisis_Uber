<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Analizador Uber/Didi{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #1a1a2e;
        }
        .sidebar .nav-link {
            color: #b0b0cc;
            padding: 0.75rem 1.25rem;
            border-radius: 0.5rem;
            margin: 0.15rem 0.5rem;
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: #fff;
            background-color: #16213e;
        }
        .sidebar .nav-link i {
            width: 1.5rem;
            text-align: center;
            margin-right: 0.5rem;
        }
        .stat-card {
            border-left: 4px solid;
            transition: transform 0.15s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
        }
        .stat-card.laburo { border-left-color: #198754; }
        .stat-card.personal { border-left-color: #0d6efd; }
        .stat-card.total { border-left-color: #6f42c1; }
        .stat-card.pending { border-left-color: #ffc107; }
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: inline-block;
        }
        .category-badge {
            font-size: 0.85em;
            min-width: 5rem;
            text-align: center;
        }
        .brand-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e0e0ff;
            padding: 1.25rem;
            border-bottom: 1px solid #2a2a4a;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar d-flex flex-column flex-shrink-0" style="width: 240px;">
            <div class="brand-text">
                <i class="bi bi-car-front"></i> Uber/Didi Analyzer
            </div>
            <ul class="nav nav-pills flex-column">
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if '/trips' in request.path %}active{% endif %}" href="/trips">
                        <i class="bi bi-list-ul"></i> Viajes
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if '/gmail' in request.path %}active{% endif %}" href="/gmail">
                        <i class="bi bi-envelope"></i> Gmail
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if '/reports' in request.path %}active{% endif %}" href="/reports">
                        <i class="bi bi-file-earmark-pdf"></i> Reportes
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if '/settings' in request.path %}active{% endif %}" href="/settings">
                        <i class="bi bi-gear"></i> Configuracion
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main content -->
        <main class="flex-grow-1 p-4" style="background-color: #f8f9fa; min-height: 100vh;">
            <div id="alerts">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
            </div>

            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
